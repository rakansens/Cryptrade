name: E2E Tests

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - drawing-operations
          - ai-functionality
          - proposal-approval
          - performance

env:
  NODE_ENV: test
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

jobs:
  e2e-full-suite:
    name: E2E Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4, 5]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cryptrade_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup test environment
        run: |
          cat > .env.test << EOF
          NEXT_PUBLIC_API_URL=http://localhost:3000
          DATABASE_URL=postgresql://postgres:password@localhost:5432/cryptrade_test
          REDIS_URL=redis://localhost:6379
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'test-key' }}
          ENABLE_MOCK_AI=true
          ENABLE_TEST_MODE=true
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      - name: Setup database
        run: |
          npm run db:generate
          npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/cryptrade_test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start server
        run: |
          npm start &
          npx wait-on http://localhost:3000 -t 30000

      - name: Run E2E tests (${{ matrix.browser }} - shard ${{ matrix.shard }}/5)
        run: |
          if [ "${{ github.event.inputs.test-suite }}" = "all" ] || [ -z "${{ github.event.inputs.test-suite }}" ]; then
            npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/5
          else
            npx playwright test tests/e2e/${{ github.event.inputs.test-suite }}.spec.ts --project=${{ matrix.browser }}
          fi
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload trace files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: test-results/**/*.png
          retention-days: 3

  e2e-report:
    name: E2E Test Report
    needs: e2e-full-suite
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: all-reports/

      - name: Merge test reports
        run: |
          npm install -g @playwright/test
          npx playwright merge-reports ./all-reports --reporter=html

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: e2e-reports/${{ github.run_number }}

  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    if: github.event.schedule || github.event.inputs.test-suite == 'performance'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Build application
        run: npm run build

      - name: Start server
        run: |
          npm start &
          npx wait-on http://localhost:3000 -t 30000

      - name: Run k6 load tests
        run: k6 run k6/drawing-load-test.js --out json=k6-results.json

      - name: Analyze performance results
        run: |
          node scripts/check-performance-requirements.ts k6-results.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results
          path: |
            k6-results.json
            performance-analysis.json
          retention-days: 90

      - name: Send alerts on regression
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Performance regression detected in nightly E2E tests!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  notify-failures:
    name: Notify Failures
    needs: [e2e-full-suite, performance-regression]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: E2E Tests Failed - ${{ github.run_number }}
          body: |
            E2E tests have failed in run ${{ github.run_number }}.
            
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions

      - name: Create issue for failures
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `E2E Tests Failed - Run #${context.runNumber}`,
              body: `## E2E Test Failure
              
              The nightly E2E tests have failed.
              
              **Run Details:**
              - Run Number: ${context.runNumber}
              - Workflow: ${context.workflow}
              - [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              
              Please investigate and fix the failing tests.`,
              labels: ['bug', 'e2e-failure', 'high-priority']
            });