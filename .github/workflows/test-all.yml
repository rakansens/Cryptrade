name: Complete Test Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate test structure
      run: |
        echo "Checking test directory structure..."
        if [ ! -d "tests/unit" ]; then
          echo "Error: tests/unit directory not found"
          exit 1
        fi
        if [ ! -d "tests/integration" ]; then
          echo "Error: tests/integration directory not found"
          exit 1
        fi
        if [ ! -d "tests/e2e" ]; then
          echo "Error: tests/e2e directory not found"
          exit 1
        fi
        if [ ! -d "tests/performance" ]; then
          echo "Error: tests/performance directory not found"
          exit 1
        fi
        echo "✅ Test directory structure is valid"
        
    - name: Check test file counts
      run: |
        echo "Test file counts:"
        echo "Unit tests: $(find tests/unit -name "*.test.ts" -o -name "*.test.tsx" | wc -l)"
        echo "Integration tests: $(find tests/integration -name "*.test.ts" | wc -l)"
        echo "E2E tests: $(find tests/e2e -name "*.spec.ts" -o -name "*.test.ts" | wc -l)"
        echo "Performance tests: $(find tests/performance -name "*.test.ts" -o -name "*.js" | wc -l)"
        
  run-all-tests:
    needs: validate-structure
    uses: ./.github/workflows/test.yml
    secrets: inherit
    
  run-e2e-tests:
    needs: validate-structure
    uses: ./.github/workflows/ci-e2e.yml
    secrets: inherit
    
  summary:
    needs: [run-all-tests, run-e2e-tests]
    runs-on: ubuntu-latest
    steps:
    - name: Test Suite Summary
      run: |
        echo "🎉 All test suites completed successfully!"
        echo "✅ Unit tests"
        echo "✅ Integration tests"
        echo "✅ E2E tests"
        echo "✅ Performance tests"