name: TypeDoc Check and Update

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 毎週月曜日の午前9時（JST）に実行
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  check-todos:
    name: Check TODOs and Unimplemented Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TODO checker
        id: todo_check
        run: |
          npx tsx scripts/check-typedoc-todos.ts > todo-report.txt 2>&1 || echo "TODOs found"
          cat todo-report.txt
      
      - name: Upload TODO report
        uses: actions/upload-artifact@v4
        with:
          name: todo-report
          path: todo-report.txt
          retention-days: 7

  validate-docs:
    name: Validate TypeDoc
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate TypeDoc with strict validation
        id: typedoc_validation
        run: |
          # TypeDocを厳密なバリデーションで実行
          npx typedoc --validation.notDocumented --validation.invalidLink || echo "validation_failed=true" >> $GITHUB_OUTPUT
      
      - name: Comment on PR if validation fails
        if: steps.typedoc_validation.outputs.validation_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⚠️ TypeDoc Validation Issues
            
            The TypeDoc generation found some issues:
            
            - **Undocumented exports**: Some exported functions/classes are missing documentation
            - **Invalid links**: Some documentation links are broken
            
            Please run \`npm run docs:api\` locally and check the output for details.
            
            ### How to fix:
            1. Add JSDoc comments to undocumented exports
            2. Fix any broken links in documentation
            3. Mark internal functions with \`@internal\` tag if they shouldn't be documented
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  update-docs-weekly:
    name: Weekly Documentation Update
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate fresh TypeDoc
        run: npm run docs:api
      
      - name: Run TODO checker
        run: npx tsx scripts/check-typedoc-todos.ts > weekly-todo-report.md || true
      
      - name: Check for changes
        id: check_changes
        run: |
          git add docs/api
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'docs: weekly TypeDoc update'
          title: '📚 Weekly TypeDoc Documentation Update'
          body: |
            ## 📚 Weekly TypeDoc Update
            
            This is the weekly automated TypeDoc documentation update.
            
            ### TODO/Unimplemented Functions Report
            
            \`\`\`
            $(cat weekly-todo-report.md)
            \`\`\`
            
            ### Changes Included
            - Updated API documentation to match current code
            - Regenerated all type definitions
            - Updated function signatures and parameters
            
            ### Review Checklist
            - [ ] Check for any breaking API changes
            - [ ] Review TODO items that need attention
            - [ ] Verify all new APIs are properly documented
            
            ---
            *This PR was automatically generated by the weekly documentation workflow.*
          branch: typedoc-update-week-${{ github.run_number }}
          delete-branch: true
          labels: |
            documentation
            automated
            weekly-update