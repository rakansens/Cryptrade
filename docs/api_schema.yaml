openapi: 3.0.3
info:
  title: Cryptrade Authentication API
  description: 認証・認可機能のRESTful API仕様
  version: 1.0.0
  contact:
    name: Cryptrade API Support
    email: api@cryptrade.com

servers:
  - url: https://api.cryptrade.com
    description: Production server
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Authentication
    description: 認証関連のエンドポイント
  - name: User
    description: ユーザー情報関連のエンドポイント

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: ユーザー登録
      description: 新規ユーザーを登録し、自動的にログイン状態にする
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: メールアドレスが既に登録されている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '429':
          description: レート制限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: ログイン
      description: メールアドレスとパスワードでログイン
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '423':
          description: アカウントがロックされている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLockedError'
        '429':
          description: レート制限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: ログアウト
      description: 現在のセッションを終了する
      operationId: logoutUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: 認証が必要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: トークンリフレッシュ
      description: リフレッシュトークンを使用して新しいアクセストークンを取得
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: トークンリフレッシュ成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: 無効なリフレッシュトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /api/auth/me:
    get:
      tags:
        - User
      summary: 現在のユーザー情報取得
      description: 認証済みユーザーの詳細情報を取得
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ユーザー情報取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 認証が必要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /api/auth/password-reset:
    post:
      tags:
        - Authentication
      summary: パスワードリセット要求
      description: パスワードリセット用のメールを送信
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: リセットメール送信成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: ユーザーが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: レート制限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/auth/verify-email:
    post:
      tags:
        - Authentication
      summary: メールアドレス確認
      description: メールアドレス確認トークンを検証
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: メールアドレス確認成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 無効なトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Request Schemas
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
          description: ユーザーのメールアドレス
        password:
          type: string
          format: password
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$'
          example: Password123
          description: パスワード（最低8文字、大小英数字を含む）
        name:
          type: string
          maxLength: 100
          example: 山田太郎
          description: ユーザーの名前（オプション）

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: Password123
        rememberMe:
          type: boolean
          default: false
          description: ログイン状態を保持するか

    LogoutRequest:
      type: object
      properties:
        allDevices:
          type: boolean
          default: false
          description: 全デバイスからログアウトするか

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: リフレッシュトークン

    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: abc123def456
          description: メール確認トークン

    # Response Schemas
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              $ref: '#/components/schemas/AuthTokens'
        timestamp:
          type: string
          format: date-time
          example: '2024-01-17T12:00:00Z'

    RefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            tokens:
              $ref: '#/components/schemas/AuthTokens'
        timestamp:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionInfo'
        timestamp:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        timestamp:
          type: string
          format: date-time

    # Data Models
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: 山田太郎
        emailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: アクセストークン（15分有効）
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: リフレッシュトークン（7日間有効）
        expiresIn:
          type: integer
          example: 900
          description: アクセストークンの有効期限（秒）
        tokenType:
          type: string
          example: Bearer

    SessionInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceInfo:
          type: object
          properties:
            browser:
              type: string
              example: Chrome
            os:
              type: string
              example: Windows
            device:
              type: string
              example: Desktop
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    # Error Schemas
    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation Error
        message:
          type: string
          example: Invalid request data
        details:
          type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: Invalid email format
        timestamp:
          type: string
          format: date-time

    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Invalid credentials
        timestamp:
          type: string
          format: date-time

    ConflictError:
      type: object
      properties:
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: Email already registered
        timestamp:
          type: string
          format: date-time

    AccountLockedError:
      type: object
      properties:
        error:
          type: string
          example: Account Locked
        message:
          type: string
          example: Too many failed login attempts
        details:
          type: object
          properties:
            lockedUntil:
              type: string
              format: date-time
            remainingTime:
              type: integer
              example: 900
              description: ロック解除までの残り時間（秒）
        timestamp:
          type: string
          format: date-time

    NotFoundError:
      type: object
      properties:
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: User not found
        timestamp:
          type: string
          format: date-time

    BadRequestError:
      type: object
      properties:
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Invalid token
        timestamp:
          type: string
          format: date-time

    RateLimitError:
      type: object
      properties:
        error:
          type: string
          example: Rate Limit Exceeded
        message:
          type: string
          example: Too many requests
        retryAfter:
          type: integer
          example: 60
          description: 再試行可能になるまでの秒数
        timestamp:
          type: string
          format: date-time

# Security Requirements
security:
  - bearerAuth: []