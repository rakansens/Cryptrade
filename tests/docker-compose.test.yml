version: '3.8'

services:
  # PostgreSQL database for testing
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cryptrade_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d cryptrade_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mock Binance WebSocket server
  mock-binance:
    build:
      context: .
      dockerfile: tests/mocks/Dockerfile.binance
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MOCK_DELAY: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application under test
  app:
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://test:test@postgres:5432/cryptrade_test
      REDIS_URL: redis://redis:6379
      MOCK_BINANCE_URL: ws://mock-binance:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-binance:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
      - ./e2e-test-results:/app/e2e-test-results
    command: npm run test:server

  # Playwright test runner
  playwright:
    build:
      context: .
      dockerfile: tests/Dockerfile.playwright
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://app:3001
      DATABASE_URL: postgresql://test:test@postgres:5432/cryptrade_test
    depends_on:
      - app
    volumes:
      - ./tests:/app/tests
      - ./e2e-test-results:/app/e2e-test-results
      - ./playwright-report:/app/playwright-report
    command: npm run test:e2e

volumes:
  postgres_test_data:

networks:
  default:
    name: cryptrade-test-network